name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo or needs a secret.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      # Nothing that looks like a key, token or password, in any commit.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run typecheck

      # android/ is generated (Continuous Native Generation), never committed.
      - run: npx expo prebuild -p android --no-install

      # The engine's JUnit suite is the desktop's Rust tests, one for one.
      - name: Engine tests
        working-directory: android
        run: ./gradlew :kickcut-engine:testDebugUnitTest

      - name: Release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      # The privacy promises in the README, checked against what was built.
      - name: Privacy gate
        run: bash scripts/privacy-gate.sh android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kickcut-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
